# EMERGENCY ONLY — prefer `prisma migrate deploy` (see quality-gate migrate-deploy job).
# `db push` skips migration history and can drift production schema.
#
# הגדרה חד-פעמית ב-GitHub → Repo → Settings → Secrets and variables → Actions:
#   DATABASE_URL  — מחרוזת Neon עם pooler (כמו ב-Vercel)
#   DIRECT_URL    — מחרוזת Neon ישירה (בלי pooler), כמו ב-.env.local
#
# הרצה: Actions → "Neon Prisma DB Push (EMERGENCY)" → Run workflow
# Confirm: type "EMERGENCY" in the input when prompted.

name: Neon Prisma DB Push (EMERGENCY)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EMERGENCY to confirm db push against Neon secrets'
        required: true
        default: ""

jobs:
  db-push:
    if: github.event.inputs.confirm == 'EMERGENCY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Prisma db push (emergency)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma db push
