# סריקת אבטחה שבועית בלבד — push/PR רצים ב-Quality Gate (workflow אחד)
name: Security (scheduled)

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
          # The scan itself decides the job: a finding exits non-zero and is
          # printed, redacted, in the log. Uploading the SARIF report was the
          # step failing — "no leaks found", then a 403 from the artifact
          # service on FinalizeArtifact — turning a clean scan red.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  npm-audit:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high || true
        continue-on-error: true
